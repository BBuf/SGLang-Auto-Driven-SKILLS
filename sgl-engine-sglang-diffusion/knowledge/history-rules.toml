schema_version = 1

[[rules]]
id = "residency.component-offload-removal"
technique = "residency"
correctness = "lossless"
summary = "On GPUs with measured headroom, keep repeatedly used components resident instead of paying stage or denoise-step H2D transfers."
triggers = [
  "profile attributes material H2D time or synchronization to component offload",
  "measured candidate peak plus safety margin fits the minimum-free selected GPU",
]
actions = [
  "compare the frozen baseline against one declared component-residency map",
  "try auxiliary components and the VAE independently before full DiT residency",
]
evidence = [
  "baseline and candidate peak memory and minimum-free memory on every frozen GPU",
  "baseline and candidate H2D copy count/duration plus full frozen-workload latency",
]
incompatibilities = [
  "explicit user placement must be changed only by the declared candidate",
  "Cache-DiT and FSDP conflicts must be resolved from the locked source",
]
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/21248"
merge_commit = "e4ad10520b8d409c6d32079a9c46ec7bdc0463ed"
validation = "H200 measurements showed automatic layerwise offload could regress several pipelines by 60-80%; the historical threshold is not a universal gate."

[[rules]]
id = "residency.partial-dit-layers"
technique = "residency"
correctness = "lossless"
summary = "Search a leading resident DiT-layer subset between full streaming and full residency."
triggers = [
  "DiT layerwise offload is active and repeated layer transfers are visible",
  "full DiT residency does not fit the measured safety envelope",
]
actions = [
  "sweep small, profile-justified resident-layer counts without changing denoise work",
  "measure partial residency separately from prefetch depth because prefetched layers can be retransferred",
]
evidence = [
  "resolved total and resident DiT layer counts",
  "H2D transfer and full-run latency deltas with positive engagement counters",
]
incompatibilities = ["requires a source-current layerwise-offload path"]
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/31538"
merge_commit = "227dadd79a17dc16c2a5e0c33ad7ea68f1e7093f"
validation = "Measured Qwen-Image and FLUX gains demonstrate the candidate family, not a portable layer count."

[[rules]]
id = "residency.memory-aware-load-order"
technique = "residency"
correctness = "lossless"
summary = "Order component construction and release by lifetime and footprint so transient peaks do not force avoidable steady-state offload."
triggers = [
  "startup or compilation peak, rather than steady-state inference, exhausts memory",
  "components have non-overlapping runtime lifetimes",
]
actions = [
  "derive load/release order from locked pipeline stages and measured component sizes",
  "restore the requested steady-state placement after transient compilation offload",
]
evidence = [
  "separate compile/startup peak and steady-state peak",
  "resolved compile and steady-state placement maps plus a complete inference run",
]
incompatibilities = ["do not score load time inside a load-excluded timing scope"]
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/25457"
merge_commit = "c1d9e37a52e6d09e3db239a5388bc198fcc9b255"
validation = "The source introduced memory-aware component ordering; each model's stage graph must still be inspected."
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/29862"
merge_commit = "119b76567daf36af7cc27ad062f9500d30a800ea"
validation = "Transient offload made compile fit on H200 while restoring the requested inference placement; compile and steady state must be verified separately."

[[rules]]
id = "kernel.regional-compile-graph"
technique = "kernel"
correctness = "lossless"
summary = "Compile stable repeated subregions and isolate dynamic attention or model-specific graph breaks instead of treating compilation as all-or-nothing."
triggers = [
  "profile shows repeated eager launch/pointwise overhead",
  "whole-model compile or graph capture fails on a stable dynamic boundary",
]
actions = [
  "use source-current model compile conditions and repeated-block boundaries",
  "compare regional compile, breakable graph, and persistent cache hypotheses independently",
]
evidence = [
  "compile/graph engagement and fallback counters",
  "warm complete-run latency with compile/init cost reported separately",
]
incompatibilities = ["do not hide compile cost when the frozen timing scope includes it"]
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/32696"
merge_commit = "917e900d4d53da6b35f67e0dd0c494ac8107c65a"
validation = "Regional compilation is opt-in and model-conditioned; boundaries must follow the locked model implementation."

[[rules]]
id = "kernel.vae-layout-output"
technique = "kernel"
correctness = "lossless"
summary = "Treat VAE decode layout and media finalization as first-class load-excluded E2E hotspots."
triggers = [
  "profile attributes material latency or copies to VAE decode/postprocess/output",
  "the target GPU has a faster layout-preserving convolution or device output path",
]
actions = [
  "try end-to-end VAE memory-format propagation rather than isolated conversions",
  "remove redundant device-host-device staging and preserve a tested fallback",
]
evidence = [
  "stage and kernel-level before/after measurements",
  "full media-contract and complete frozen-workload validation",
]
incompatibilities = ["FP32-to-BF16 decode belongs to the quality-gated quantization lane"]
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/27431"
merge_commit = "aa18a68ac52cd3d4cb56bac551be4e43fe0d7516"
validation = "channels_last_3d accelerated Hopper Conv3d when layout was preserved across the VAE path; layout conversion can erase the gain."
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/32784"
merge_commit = "22151edca162da06d913478c96bd8e3db84f4380"
validation = "CUDA video finalization removed staging and kept an explicit fallback; codec/media equivalence remains mandatory."

[[rules]]
id = "kernel.exact-reuse-sync-removal"
technique = "kernel"
correctness = "lossless"
summary = "Cache provably invariant tensors and remove host synchronization from schedulers without reducing logical work."
triggers = [
  "identical conditioning or scheduler values are recomputed across denoise steps",
  "profile exposes GPU synchronization or scalar extraction in the scheduler path",
]
actions = [
  "prove tensor inputs and lifetime before exact cross-step reuse",
  "keep scheduler state on device and batch invariant construction",
]
evidence = [
  "unchanged global step and DiT-call counts with a method-equivalence argument",
  "profile delta and complete frozen-workload latency",
]
incompatibilities = ["approximate reuse or changed schedules belong to quality-gated lanes"]
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/29755"
merge_commit = "ca73c7705592e2c175c2a5d53f1b195a364bd95b"
validation = "Helios reused cross-attention K/V only where conditioning inputs were invariant; the proof boundary is model-specific."
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/27440"
merge_commit = "7c6f9542c711133b5021c5fb9a7e200d60690ca8"
validation = "UniPC removed repeated GPU synchronization while preserving the scheduler algorithm and measured a complete workload."

[[rules]]
id = "kernel.communication-zero-staging"
technique = "kernel"
correctness = "lossless"
summary = "For a frozen supported topology, remove redundant staging and layout copies around distributed attention collectives."
triggers = [
  "copy/layout stages are material around distributed attention",
  "the exact rank count, peer-access, transport, and shape constraints are satisfied",
]
actions = [
  "try a guarded zero-staging or fused layout/collective path",
  "retain a source-current fallback for unsupported rank or peer-access configurations",
]
evidence = [
  "frozen rank map and collective shape coverage",
  "copy/collective timeline plus complete multi-rank workload latency",
]
incompatibilities = ["parallel degrees and rank maps remain frozen after baseline"]
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/31854"
merge_commit = "754b692afc2948137c4315989481e406acae0159"
validation = "CUDA IPC zero-staging was narrowly gated to two-rank Ulysses; unsupported topologies must not inherit the fast path."

[[rules]]
id = "cache.mount-before-compile"
technique = "cache"
correctness = "quality_gated"
summary = "When approximate Cache-DiT and torch.compile are both active, mount the cache wrapper before tracing the path that real requests execute."
triggers = [
  "the frozen candidate combines Cache-DiT with torch.compile",
  "warmup compiles an unwrapped transformer and the first real request pays a second compile",
]
actions = [
  "mount the cache implementation before compile warmup and make installation idempotent",
  "measure first-real-request and steady-state behavior separately on the complete workload",
]
evidence = [
  "positive cache and compiler engagement with no silent fallback",
  "quality-gated full workload plus warmup/first-request timing decomposition",
]
incompatibilities = ["respect source-current Cache-DiT conflicts with FSDP and layerwise offload"]
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/25328"
merge_commit = "20123e0b165556cf2b8ec05fac866a3bd2a29ccd"
validation = "Mounting Cache-DiT before compile cut the first real denoise request by 43.77% in the reported H200 setup; the integrated quality gate still applies."

[[rules]]
id = "quantization.vae-decode-only-precision"
technique = "quantization"
correctness = "quality_gated"
summary = "Search VAE decode precision independently from encode and DiT precision so the quality boundary matches the optimized stage."
triggers = [
  "VAE decode is a material E2E stage and the target GPU has faster BF16/FP16 convolution",
  "the locked pipeline exposes or can safely add a decode-only precision policy",
]
actions = [
  "compare FP32, BF16, and FP16 decode without changing encode precision",
  "keep model-family defaults conservative and use an explicit candidate activation",
]
evidence = [
  "decode-stage and full frozen-workload latency with resolved encode/decode dtype",
  "aligned LPIPS, built-in visual review, media contract, and final quality evidence",
]
incompatibilities = ["do not inherit Wan2.1 defaults for Wan2.2 or a ModelOpt checkpoint without validation"]
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/32697"
merge_commit = "4f5b50c576e8118614174d5762c6818709227f58"
validation = "Wan2.1 H100 decode improved 441.08 to 326.00 ms with reported quality metrics, while Wan2.2 deliberately retained FP32 by default."

[[rules]]
id = "token-pruning.progressive-resolution-schedule"
technique = "token_pruning"
correctness = "quality_gated"
summary = "Run early denoise steps at a justified coarse latent token grid, then rebuild all resolution-dependent state at the measured transition."
triggers = [
  "attention cost scales materially with the latent token grid",
  "the model has a source-current pack/unpack and position/mask refresh implementation",
]
actions = [
  "sweep conservative transition schedules instead of copying a delta from another model",
  "refresh scheduler, position IDs, masks, conditioning, and cache context for every transformer",
]
evidence = [
  "actual token counts and transition engagement for every denoise stage",
  "complete quality-gated workload with temporal/spatial artifact review",
]
incompatibilities = ["preserve the frozen parallel topology and reject source-current sequence-parallel conflicts"]
[[rules.sources]]
pr_url = "https://github.com/sgl-project/sglang/pull/27736"
merge_commit = "7f57b344c9e1caa65505e72f6f2029591caf5ad7"
validation = "Ideogram 4 reported 1.19-1.56x denoise speedups across schedules; transitions and quality are model-specific and remain gated."
