  "layout-copy-launch",
  "normalization-activation-projection-fusion",
  "attention-shape-specialization",
  "gemm-quantization-epilogue",
  "communication-layout-overlap",
  "custom-or-upstream-kernel",
  "compile-graph-warmup",
  "vae-decode-postprocess",
  "scheduler-precompute-sync",
]

[techniques.cache]
