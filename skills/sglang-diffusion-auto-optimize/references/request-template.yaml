schema_version: 1
machine: <machine-skill-or-ssh-alias>
model: <model-id-or-checkpoint>
sglang_checkout: <absolute-existing-sglang-checkout>
sglang_ref: <full-fetched-main-commit>
gpu_count: 1
target_speedup: 2.0
allow_quality_gated: true

baseline:
  cwd: <absolute-baseline-working-directory>
  timing_scope: load_excluded_end_to_end
  command: >-
    CUDA_VISIBLE_DEVICES=0 python
    python/sglang/multimodal_gen/benchmarks/bench_offline_throughput.py
    --model-path <model-id-or-checkpoint>
    --dataset vbench
    --dataset-path <five-prompt-file>
    --num-prompts 5
    <the-rest-of-the-user-command>

# The command above is the user-selected discovery baseline. Do not inject
# --performance-mode speed. Its explicit parallelism flags are frozen.

source:
  sglang_repo: <verified-sglang-origin-url>
  sglang_ref: <full-fetched-main-commit>

agent:
  command: [codex, exec]
  model: <requested-model-or-null>

run_root: <absolute-persistent-campaign-root>
idempotency_key: <stable-machine-model-workload-target-key>

# Include only when the user supplied a positive budget.
# token_budget: 10000000
